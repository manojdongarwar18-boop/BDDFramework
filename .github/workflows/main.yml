
name: BDDPlaywright Demo

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_ENV: qa
      BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com/' }}
      USERNAME: ${{ secrets.TEST_USERNAME || 'standard_user' }}
      PASSWORD: ${{ secrets.TEST_PASSWORD || 'secret_sauce' }}
      INVALID_USERNAME: ${{ secrets.INVALID_USERNAME || 'invalid_user' }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD || 'invalid_password' }}
      BROWSER: chromium
      HEADLESS: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-bdd-framework/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playwright-bdd-framework

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: playwright-bdd-framework

      - name: Build
        run: npm run build
        working-directory: playwright-bdd-framework

      - name: Run Cucumber BDD tests
        run: npm run test:bdd:html
        working-directory: playwright-bdd-framework

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            playwright-bdd-framework/reports/**
            playwright-bdd-framework/screenshots/**
          if-no-files-found: ignore
          retention-days: 7
